[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digsite"
version = "0.1.0"
description = "Hybrid search engine and RAG pipeline built from first principles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Moris Gómez" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140",
    "httpx>=0.27",
    "numpy>=2.3",
    "sentence-transformers>=6.0",
    "snowballstemmer>=3.0",
    "trafilatura>=2.0",
    "uvicorn>=0.50",
]

[project.scripts]
digsite = "digsite.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "networkx>=3.5",  # reference implementation that PageRank is tested against
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digsite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-q", "-m", "not model"]
markers = ["model: loads the real embedding model; run with `pytest -m model`"]

[tool.mypy]
files = ["src"]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = "snowballstemmer"  # ships without type information
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "PTH", "PT", "RUF"]
