name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The CPU build of PyTorch: the default one brings gigabytes of CUDA libraries.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.9"
          python -m pip install -e . --group dev
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Types
        run: mypy
      # The tests that load the real embedding model (pytest -m model) are left
      # out: they download it, and every other test runs without the network.
      - name: Tests
        run: pytest

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --tag digsite .
      - name: Smoke test
        run: docker run --rm digsite --version
